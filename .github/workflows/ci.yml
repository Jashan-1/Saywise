name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sayso
          POSTGRES_PASSWORD: sayso
          POSTGRES_DB: sayso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sayso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAYSO_TEST_DATABASE_URL: postgresql+asyncpg://sayso:sayso@localhost:5432/sayso_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
